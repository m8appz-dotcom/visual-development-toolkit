<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pete · Calibración neutra</title>
<style>body{margin:0;background:#e9eaed;color:#20242b;font:14px system-ui}header{position:absolute;z-index:2;top:16px;left:16px;right:16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 18px;background:#fffffff0;border-radius:12px}h1{font-size:18px;margin:0 auto 0 0}button,select{font:inherit;padding:9px 12px;border:1px solid #c9ced5;background:white;border-radius:7px;cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #517cbd}#status{position:absolute;bottom:18px;left:18px;right:18px;background:#ffffffed;border-radius:8px;padding:12px}canvas{display:block;width:100vw;height:100dvh;touch-action:none}</style>
<header><h1>Pete · Calibración neutra</h1><button id="center">Centrar modelo</button><button id="bones">Mostrar esqueleto</button><label for="poses">Postura</label><select id="poses" aria-label="Postura"></select><button id="pose">Restaurar postura</button><label for="view">Vista</label><select id="view" aria-label="Vista"><option value="front">Frente</option><option value="side">Perfil</option><option value="back">Espalda</option><option value="leftHand">Mano izquierda</option><option value="rightHand">Mano derecha</option></select></header><canvas aria-label="Modelo 3D. Arrastra para girar; usa la rueda para acercarte."></canvas><div id="status" role="status">Cargando el modelo…</div>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
<script type="module">
import * as T from 'three';import {OrbitControls} from './vendor/OrbitControls.js';import {GLTFLoader} from './vendor/loaders/GLTFLoader.js';
const canvas=document.querySelector('canvas'),status=document.querySelector('#status'),renderer=new T.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.setClearColor(0xe9eaed);const scene=new T.Scene(),camera=new T.PerspectiveCamera(38,innerWidth/innerHeight,.01,10000),controls=new OrbitControls(camera,canvas);controls.enableDamping=true;scene.add(new T.HemisphereLight(0xffffff,0x687383,2.7));const light=new T.DirectionalLight(0xffffff,3);light.position.set(3,5,4);scene.add(light);let model,box,helper,bone,initial,posed=false,frames=0,meshes=[];window.rigViewer={state:'loading'};
function center(){const c=box.getCenter(new T.Vector3()),s=box.getSize(new T.Vector3()),m=Math.max(s.x,s.y,s.z);camera.position.copy(c).add(new T.Vector3(.45,.18,1).normalize().multiplyScalar(m*2.6));controls.target.copy(c);controls.minDistance=m*.05;controls.maxDistance=m*10;camera.near=m/10000;camera.far=m*100;camera.updateProjectionMatrix();controls.update();}
document.querySelector('#center').onclick=()=>box&&center();document.querySelector('#bones').onclick=e=>{if(helper){helper.visible=!helper.visible;e.target.textContent=helper.visible?'Ocultar esqueleto':'Mostrar esqueleto';}};
const specs=[['Reposo',null,null,0],['Hombro izquierdo','L_Upperarm','z',.65],['Hombro derecho','R_Upperarm','z',-.65],['Codo izquierdo','L_Forearm','z',.9],['Codo derecho','R_Forearm','z',-.9],['Cadera izquierda','L_Thigh','x',.6],['Cadera derecha','R_Thigh','x',.6],['Rodilla izquierda','L_Calf','x',-.9],['Rodilla derecha','R_Calf','x',-.9],['Giro de torso','Spine01','y',.35],['Muñeca izquierda','L_Hand','z',.45],['Muñeca derecha','R_Hand','z',-.45],['Dedo izquierdo','L_Index1','z',.7],['Dedo derecho','R_Index1','z',-.7]];let saved=[];
const poseSelect=document.querySelector('#poses');for(let i=0;i<specs.length;i++){const option=document.createElement('option');option.value=i;option.textContent=specs[i][0];poseSelect.append(option);}
function applyPose(index){if(!model)return;for(const [b,q]of saved)b.quaternion.copy(q);const [name,suffix,axis,angle]=specs[index];const b=saved.find(([b])=>b.name===suffix||b.name.endsWith('_'+suffix))?.[0];if(b)b['rotate'+axis.toUpperCase()](angle);model.updateMatrixWorld(true);for(const mesh of meshes)mesh.skeleton.update();canvas.dataset.pose=JSON.stringify({name,bone:b?.name??null,active:index!==0,available:index===0||!!b});}
poseSelect.onchange=()=>applyPose(Number(poseSelect.value));document.querySelector('#pose').onclick=()=>{poseSelect.value='0';applyPose(0);};document.querySelector('#view').onchange=e=>{if(!box)return;if(e.target.value.endsWith('Hand')){const suffix=e.target.value==='leftHand'?'L_Hand':'R_Hand',b=saved.find(([b])=>b.name===suffix||b.name.endsWith('_'+suffix))?.[0];if(b){const c=b.getWorldPosition(new T.Vector3()),m=box.getSize(new T.Vector3()).length();camera.position.copy(c).add(new T.Vector3(.03,.05,m*.23));controls.target.copy(c);controls.update();}return;}const c=box.getCenter(new T.Vector3()),distance=c.distanceTo(camera.position),direction=e.target.value==='back'?new T.Vector3(0,.05,-1):e.target.value==='side'?new T.Vector3(1,.05,0):new T.Vector3(0,.05,1);camera.position.copy(c).add(direction.normalize().multiplyScalar(distance));controls.target.copy(c);controls.update();};
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();});renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera);Object.assign(window.rigViewer,{frames:++frames,drawnTriangles:renderer.info.render.triangles,camera:camera.position.toArray()});});
try{const gltf=await new GLTFLoader().loadAsync('./Pete-calibrated.glb');model=gltf.scene;scene.add(model);model.traverse(o=>{if(o.isSkinnedMesh)meshes.push(o);if(o.isBone&&/(^|_)L_Upperarm$/i.test(o.name))bone=o;});if(!meshes.length)throw Error('El archivo no contiene mallas con rig');bone??=meshes[0].skeleton.bones.find(b=>/arm/i.test(b.name));initial=bone?.quaternion.clone();model.traverse(o=>{if(o.isBone)saved.push([o,o.quaternion.clone()]);});helper=new T.SkeletonHelper(model);helper.visible=false;scene.add(helper);box=new T.Box3().setFromObject(model);center();const joints=new Set(meshes.flatMap(m=>m.skeleton.bones.map(b=>b.uuid))).size;status.textContent=`Arrastra para girar · Rueda para acercarte · ${joints} articulaciones · ${meshes.length} ${meshes.length===1?'malla':'mallas'} con rig`;window.rigViewer={state:'ready',joints,skinnedMeshes:meshes.length,bone:bone?.name,bounds:{min:box.min.toArray(),max:box.max.toArray()}};canvas.dataset.model=JSON.stringify(window.rigViewer);}catch(e){status.textContent='No se pudo abrir el modelo.';window.rigViewer={state:'error',error:String(e)};}
</script></html>
