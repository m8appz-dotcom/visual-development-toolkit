name: Improvement
description: Define a concrete change and its acceptance evidence.
title: ""
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and intended outcome
      description: Describe the observed problem and who needs the change.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable outcomes that would complete this issue.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification and constraints
      description: Describe relevant checks, data permissions, costs, and recovery needs. Never post secrets.
    validations:
      required: true
