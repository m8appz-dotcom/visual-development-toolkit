name: Portable MCP checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  portable:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Actual stdio MCP regression checks
        run: python -m unittest discover -s tests -v
      - name: Generate packaging walkthrough
        run: python tools/create_demo.py
      - uses: actions/upload-artifact@v4
        with:
          name: toolkit-portable-demo-${{ matrix.os }}
          path: docs/examples
